name: CI

# Runs the whole suite the way `make test` does locally: release configuration,
# single worker, Xcode's Swift Testing frameworks. Tests that need a real
# Banktivity vault skip on a runner, which has none.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: make test
